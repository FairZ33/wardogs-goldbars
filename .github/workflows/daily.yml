name: Post WARDOGS gold price
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
concurrency:
  group: wardogs-gold-price
  cancel-in-progress: false
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check price parser and Discord posting
        run: node --test get-price.test.mjs post-price.test.mjs
      - name: Post current price to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node post-price.mjs
