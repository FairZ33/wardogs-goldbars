name: Post WARDOGS gold price
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/daily.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: wardogs-gold-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  price:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install chart dependency
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check analysis, parser, chart and Discord posting
        run: pnpm test
      - name: Restore last alert state for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prefix = `gold-alert-state-${context.ref.replace('refs/heads/', '')}-`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner:context.repo.owner, repo:context.repo.repo, per_page:100});
            const previous = artifacts.filter(a => !a.expired && a.name.startsWith(prefix)).sort((a,b)=>b.id-a.id)[0];
            if (!previous) { core.notice('No previous alert state; this run initializes it.'); return; }
            const archive = await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:previous.id,archive_format:'zip'});
            fs.writeFileSync('alert-state.zip',Buffer.from(archive.data));
      - name: Read restored alert state
        shell: bash
        run: |
          mkdir -p .state
          if [ -f alert-state.zip ]; then
            unzip -p alert-state.zip alert-state.json > .state/alert-state.json
          fi
      - name: Post current price to development Discord
        if: github.ref == 'refs/heads/dev'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_DEV }}
          GOLD_ALERT_MAX_PRICE: ${{ vars.GOLD_ALERT_MAX_PRICE }}
          GOLD_ALERT_ROLE_ID: ${{ vars.GOLD_ALERT_ROLE_ID_DEV }}
          PLANNER_URL: ${{ vars.PLANNER_URL_DEV }}
        run: node post-price.mjs
      - name: Post current price to production Discord
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOLD_ALERT_MAX_PRICE: ${{ vars.GOLD_ALERT_MAX_PRICE }}
          GOLD_ALERT_ROLE_ID: ${{ vars.GOLD_ALERT_ROLE_ID }}
          PLANNER_URL: ${{ vars.PLANNER_URL }}
        run: node post-price.mjs
      - name: Save dated price snapshot and embed preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-snapshot-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 90
          if-no-files-found: warn

      - name: Save confirmed alert state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-alert-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .state/alert-state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
      - name: Package savings planner for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.ENABLE_PLANNER_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/planner/
  deploy-planner:
    needs: price
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PLANNER_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy savings planner
        id: deployment
        uses: actions/deploy-pages@v4

